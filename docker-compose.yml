services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ai_platform_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ai_platform_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_platform_net

networks:
  ai_platform_net:
    driver: bridge

volumes:
  postgres_data:
